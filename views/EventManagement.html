<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Event Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body{
        font-family: Arial, sans-serif;
        background:#f4f6fb;
        padding:20px;
    }
    .container{
        max-width:900px;
        margin:auto;
    }
    h2{
        margin-top:0;
    }
    .card{
        background:#ffffff;
        padding:16px;
        border-radius:10px;
        margin-bottom:16px;
        box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }
    label{
        display:block;
        margin-top:8px;
        font-weight:bold;
    }
    input, textarea, select{
        width:100%;
        padding:8px;
        margin-top:4px;
    }
    button{
        margin-top:10px;
        padding:8px 14px;
        border:none;
        border-radius:6px;
        background:#2563eb;
        color:#fff;
        cursor:pointer;
    }
    button:hover{
        opacity:0.9;
    }
    .delete-btn{
        background:#dc2626;
        margin-left:6px;
    }
    .event{
        border-bottom:1px solid #ddd;
        padding:10px 0;
    }
    .event:last-child{
        border:none;
    }
</style>
</head>

<body>

<div class="container">

    <h2>Hotel Event Management</h2>


    <div class="card">
        <label>Select Role</label>
        <select id="roleSelect">
            <option value="guest">Guest</option>
            <option value="admin">Admin</option>
        </select>
    </div>

    
    <div class="card" id="eventForm">
        <h3>Create / Update Event</h3>

        <label>Event Title</label>
        <input type="text" id="title">

        <label>Description</label>
        <textarea id="desc"></textarea>

        <label>Event Date</label>
        <input type="date" id="date">

        <button onclick="saveEvent()">Save Event</button>
    </div>

    
    <div class="card">
        <h3>Upcoming Events</h3>
        <div id="eventList"></div>
    </div>

</div>

<script src="script2.js"></script>
</body>
</html>
