<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel - Reports & Analytics</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root{
            --primary:#2563eb;
            --secondary:#64748b;
            --bg:#f1f5f9;
            --card:#ffffff;
            --text:#0f172a;
            --border:#e2e8f0;
        }

        *{box-sizing:border-box}
        body{
            margin:0;
            font-family:system-ui, Arial;
            background:var(--bg);
            color:var(--text);
        }

        /* Navbar */
        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 20px;
            background:#0f172a;
            color:#fff;
        }
        .nav-links a{
            color:#cbd5f5;
            margin:0 10px;
            text-decoration:none;
        }
        .nav-links a.active{color:#fff;font-weight:600}
        .nav-right{display:flex;align-items:center;gap:10px}

        /* Main */
        .dashboard-main{
            max-width:1100px;
            margin:auto;
            padding:20px;
        }

        .dashboard-header h2{margin-bottom:4px}

        /* Cards */
        .report-card,
        .summary-card,
        .quick-report-card{
            background:var(--card);
            border-radius:12px;
            padding:16px;
            border:1px solid var(--border);
        }

        .form-row{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:12px;
        }

        label{font-size:14px}
        input,select{
            width:100%;
            padding:8px;
            border-radius:8px;
            border:1px solid var(--border);
        }

        .button-group{
            margin-top:14px;
            display:flex;
            gap:10px;
        }

        .btn{
            padding:8px 14px;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }
        .btn-primary{background:var(--primary);color:#fff}
        .btn-secondary{background:#e2e8f0}

        /* Results */
        .report-summary{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
            gap:12px;
            margin:16px 0;
        }

        .summary-card p{
            font-size:22px;
            font-weight:700;
            margin:0;
        }

        /* Table */
        .data-table{
            width:100%;
            border-collapse:collapse;
            margin-top:12px;
        }
        .data-table th,
        .data-table td{
            border:1px solid var(--border);
            padding:8px;
            text-align:left;
        }
        .data-table th{background:#f8fafc}

        /* Quick Reports */
        .quick-reports-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
            gap:14px;
        }
        .quick-report-card{
            cursor:pointer;
            transition:.2s;
        }
        .quick-report-card:hover{
            transform:translateY(-3px);
            box-shadow:0 6px 18px rgba(0,0,0,.08);
        }
        .report-icon{font-size:28px}
    </style>
</head>
<body>

<nav class="navbar">
    <h1>🏨 Grand Hotel</h1>
    <div class="nav-links">
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a class="active" href="#">Reports</a>
    </div>
    <div class="nav-right">
        <span>Admin</span>
        <button class="btn btn-secondary">Logout</button>
    </div>
</nav>

<main class="dashboard-main">

    <div class="dashboard-header">
        <h2>Reports & Analytics</h2>
        <p>Generate and export detailed reports</p>
    </div>

    <div class="report-card">
        <h3>Generate Report</h3>
        <form id="reportForm">
            <div class="form-row">
                <div>
                    <label>Report Type</label>
                    <select id="reportType">
                        <option value="Users">User Report</option>
                        <option value="Bookings">Booking Report</option>
                        <option value="Revenue">Revenue Report</option>
                    </select>
                </div>
                <div>
                    <label>Date From</label>
                    <input type="date" id="dateFrom">
                </div>
                <div>
                    <label>Date To</label>
                    <input type="date" id="dateTo">
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary">Generate</button>
                <button type="button" onclick="exportCSV()" class="btn btn-secondary">Export CSV</button>
            </div>
        </form>
    </div>

    <div id="reportResults" style="display:none;">
        <div class="report-summary">
            <div class="summary-card"><h4>Total</h4><p id="summary1">0</p></div>
            <div class="summary-card"><h4>Average</h4><p id="summary2">0</p></div>
            <div class="summary-card"><h4>Peak</h4><p id="summary3">0</p></div>
        </div>

        <canvas id="reportChart"></canvas>

        <table class="data-table" id="reportTable">
            <thead><tr><th>Date</th><th>Value</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>

    <h3 style="margin-top:30px">Quick Reports</h3>
    <div class="quick-reports-grid">
        <div class="quick-report-card" onclick="generateQuickReport('daily')">📊 Daily</div>
        <div class="quick-report-card" onclick="generateQuickReport('weekly')">📈 Weekly</div>
        <div class="quick-report-card" onclick="generateQuickReport('monthly')">📅 Monthly</div>
    </div>

</main>

<script src="script5.js"></script>
</body>
</html>
