<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel - Welcome</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="language-switcher">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <div class="container">
        <div class="welcome-card">
            <div class="hotel-logo">
                <h1>🏨 Grand Hotel</h1>
                <p data-translate="welcome_subtitle">Your Luxury Stay Awaits</p>
            </div>
            
            <div class="welcome-content">
                <h2 data-translate="welcome_title">Welcome to Our Hotel Management System</h2>
                <p data-translate="welcome_description">Experience luxury and comfort. Sign in to manage your bookings or create a new account to get started.</p>
                
                <div class="button-group">
                    <a href="signin.html" class="btn btn-primary" data-translate="sign_in">Sign In</a>
                    <a href="signup.html" class="btn btn-secondary" data-translate="sign_up">Sign Up</a>
                </div>
            </div>

            <div class="features-preview">
                <div class="feature-item">
                    <span class="feature-icon">🛏️</span>
                    <span data-translate="feature_rooms">Luxury Rooms</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🍽️</span>
                    <span data-translate="feature_dining">Fine Dining</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🏊</span>
                    <span data-translate="feature_amenities">Premium Amenities</span>
                </div>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="language.js"></script>
</body>
</html>
