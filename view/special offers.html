<!DOCTYPE html>
<html>
<head>
    <title>Special Offers - California Bay</title>
    <link rel="stylesheet" href="../assets/special offers.css">
</head>
<body>

    <div class="header">
        <img src="../assets/About Us.png" alt="California Bay Logo" class="logo">
        <h1 class="title">Grand Hotel - Special Offers</h1>
    </div>
    
    <div class="timer-box">
        <h3>Offer Ends In:</h3>
        <h2 id="countdown">Loading...</h2>
    </div>

    <div class="container">
        
        <div class="card">
            <h3>Semester Saver</h3>
            <p>Pay 6 months in advance & Get 10% OFF.</p>
            <button onclick="getOffer('Semester Saver')">Book Now</button>
        </div>

        <div class="card">
            <h3>Referral Bonus</h3>
            <p>Bring a friend & Get 500 TK.</p>
            <button onclick="getOffer('Referral Bonus')">Get Code</button>
        </div>

        <div class="card">
            <h3>No Admission Fee</h3>
            <p>For new students only.</p>
            <button onclick="getOffer('No Admission Fee')">Claim Now</button>
        </div>

    </div>

    <script src="..//assets/special offers.js"></script>
</body>
</html>
