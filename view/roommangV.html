<!DOCTYPE html>
<html lang="en">

<head>
    <title>Room Management</title>
    <link rel="stylesheet" href="../Asset/css/roommangCss.css">
</head>

<body>
    <div class="container">
        <h2>Room Management</h2>
        <form id="roomManagementForm">

            <label for="roomType">Room Type:</label>
            <select id="roomType">
                <option value="">--Select Room Type--</option>
                <option value="single">Single Room - 1000 BDT</option>
                <option value="double">Double Room - 1500 BDT</option>
                <option value="suite">Suite - 2500 BDT</option>
            </select>
            <span id="errorRoomType" class="error-message"></span><br><br>


            <label for="roomNumber">Room Number:</label>
            <input type="number" id="roomNumber" placeholder="Enter room number">
            <span id="errorRoomNumber" class="error-message"></span><br><br>


            <label for="roomAvailability">Availability:</label>
            <select id="roomAvailability">
                <option value="">--Select Availability--</option>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
            <span id="errorRoomAvailability" class="error-message"></span><br><br>


            <label for="roomStatus">Room Status:</label>
            <select id="roomStatus">
                <option value="">--Select Status--</option>
                <option value="clean">Clean</option>
                <option value="dirty">Dirty</option>
            </select>
            <span id="errorRoomStatus" class="error-message"></span><br><br>


            <button type="submit">Add Room</button>
            <p id="formError" style="color: red; display: none;">Please fill in all required fields.</p>
        </form>


        <div id="confirmation" style="display:none;">
            <h3>Room Added Successfully</h3>
            <p>Room Type: <span id="confirmationRoomType"></span></p>
            <p>Room Number: <span id="confirmationRoomNumber"></span></p>
            <p>Room Availability: <span id="confirmationRoomAvailability"></span></p>
            <p>Room Status: <span id="confirmationRoomStatus"></span></p>
        </div>
    </div>

    <script src="../Asset/js/roommangJs.js"></script>
</body>

</html>
