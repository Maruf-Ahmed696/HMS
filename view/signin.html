<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel - Sign In</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="language-switcher">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <div class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🏨 Grand Hotel</h1>
                <h2 data-translate="welcome_back">Welcome Back</h2>
            </div>

            <form id="signinForm" class="auth-form">
                <div class="form-group">
                    <label for="emailOrUsername" data-translate="email_or_username">Email or Username</label>
                    <input type="text" id="emailOrUsername" name="emailOrUsername" required placeholder="Enter email or username">
                    <span class="error-message" id="loginError"></span>
                </div>

                <div class="form-group">
                    <label for="password" data-translate="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span data-translate="remember_me">Remember me</span>
                    </label>
                    <a href="forgot-password.html" class="forgot-link" data-translate="forgot_password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-full" data-translate="sign_in">Sign In</button>

                <div class="auth-footer">
                    <p><span data-translate="no_account">Don't have an account?</span> <a href="signup.html" data-translate="sign_up">Sign Up</a></p>
                </div>
            </form>

            <div class="demo-accounts">
                <p data-translate="demo_accounts">Demo Accounts:</p>
                <small>Admin: admin@hotel.com / admin123</small><br>
                <small>Staff: staff@hotel.com / staff123</small><br>
                <small>Guest: guest@hotel.com / guest123</small>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="language.js"></script>
    <script src="auth.js"></script>
    <script>
        document.getElementById('signinForm').addEventListener('submit', handleSignin);
        initDemoAccounts();
    </script>
</body>
</html>
