<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback and Reviews</title>
    <link rel="stylesheet" href="../Asset/css/feedrevCss.css">
</head>

<body>
    <div class="container">
        <h2>Leave Your Feedback</h2>

        <form id="reviewForm">

            <label for="rating">Rating:</label>
            <select id="rating">
                <option value="">--Select Rating--</option>
                <option value="1">1 Star</option>
                <option value="2">2 Stars</option>
                <option value="3">3 Stars</option>
                <option value="4">4 Stars</option>
                <option value="5">5 Stars</option>
            </select>
            <span id="errorRating" class="error-message"></span><br><br>


            <label for="review">Review:</label><br>
            <textarea id="review" rows="4" cols="50" placeholder="Write your review here..."></textarea>
            <span id="errorReview" class="error-message"></span><br><br>


            <button type="submit">Submit Review</button>
            <p id="formError" style="color:red; display:none;">Please fill in all required fields.</p>
        </form>


        <div id="confirmation" style="display:none;">
            <h3>Your Review Submitted</h3>
            <p>Rating: <span id="confirmRating"></span></p>
            <p>Review: <span id="confirmReview"></span></p>
        </div>
    </div>

    <script src="../Asset/js/feedrevJs.js"></script>
</body>

</html>
