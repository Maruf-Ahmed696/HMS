<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel - Profile Setup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="language-switcher">
        <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>
    </div>

    <div class="container">
        <div class="auth-card profile-card">
            <div class="auth-header">
                <h1>🏨 Grand Hotel</h1>
                <h2 data-translate="complete_profile">Complete Your Profile</h2>
                <p data-translate="profile_subtitle">Tell us a bit more about yourself</p>
            </div>

            <form id="profileForm" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone" data-translate="phone_number">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="+1 234 567 8900">
                    </div>

                    <div class="form-group">
                        <label for="dateOfBirth" data-translate="date_of_birth">Date of Birth</label>
                        <input type="date" id="dateOfBirth" name="dateOfBirth">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address" data-translate="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Enter your address">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city" data-translate="city">City</label>
                        <input type="text" id="city" name="city" placeholder="City">
                    </div>

                    <div class="form-group">
                        <label for="country" data-translate="country">Country</label>
                        <select id="country" name="country">
                            <option value="">Select Country</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="CA">Canada</option>
                            <option value="AU">Australia</option>
                            <option value="FR">France</option>
                            <option value="DE">Germany</option>
                            <option value="ES">Spain</option>
                            <option value="IT">Italy</option>
                            <option value="JP">Japan</option>
                            <option value="CN">China</option>
                            <option value="IN">India</option>
                            <option value="BR">Brazil</option>
                            <option value="MX">Mexico</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="preferences" data-translate="preferences">Room Preferences</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="smoking">
                            <span data-translate="pref_smoking">Non-smoking room</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="highFloor">
                            <span data-translate="pref_high_floor">High floor</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="quietRoom">
                            <span data-translate="pref_quiet">Quiet room</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="accessible">
                            <span data-translate="pref_accessible">Accessible room</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="specialRequests" data-translate="special_requests">Special Requests</label>
                    <textarea id="specialRequests" name="specialRequests" rows="3" placeholder="Any special requests or notes..."></textarea>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-secondary" onclick="skipProfile()" data-translate="skip_for_now">Skip for Now</button>
                    <button type="submit" class="btn btn-primary" data-translate="save_profile">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="language.js"></script>
    <script src="auth.js"></script>
    <script>
        checkAuth();
        
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'signin.html';
                return;
            }

            const profileData = {
                phone: document.getElementById('phone').value,
                dateOfBirth: document.getElementById('dateOfBirth').value,
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                country: document.getElementById('country').value,
                preferences: Array.from(document.querySelectorAll('input[name="preferences"]:checked')).map(cb => cb.value),
                specialRequests: document.getElementById('specialRequests').value,
                profileCompleted: true
            };

            const users = JSON.parse(localStorage.getItem('hotelUsers')) || [];
            const userIndex = users.findIndex(u => u.id === currentUser.id);
            if (userIndex !== -1) {
                users[userIndex] = { ...users[userIndex], ...profileData };
                localStorage.setItem('hotelUsers', JSON.stringify(users));
                
                currentUser.profileCompleted = true;
                localStorage.setItem('currentUser', JSON.stringify({ ...currentUser, ...profileData }));
            }

            redirectToDashboard(currentUser.role);
        });

        function skipProfile() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                redirectToDashboard(currentUser.role);
            }
        }

        function redirectToDashboard(role) {
            if (role === 'admin') {
                window.location.href = 'dashboard.html';
            } else if (role === 'staff') {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'guest-dashboard.html';
            }
        }
    </script>
</body>
</html>
