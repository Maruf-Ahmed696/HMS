<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Task Management</title>
    <link rel="stylesheet" href="../Asset/css/stafftaskmCss.css">
</head>

<body>
    <div class="container">
        <h2>Staff Task Management</h2>


        <form id="taskForm">
            <h3>Assign Task</h3>

            <label for="taskName">Task Name:</label>
            <input type="text" id="taskName" placeholder="Enter task name">
            <span id="errorTaskName" class="error-message"></span><br><br>


            <label for="assignStaff">Assign to Staff:</label>
            <select id="assignStaff">
                <option value="">--Select Staff--</option>
                <option value="staff1">Staff 1</option>
                <option value="staff2">Staff 2</option>
                <option value="staff3">Staff 3</option>
            </select>
            <span id="errorAssignStaff" class="error-message"></span><br><br>


            <label for="taskStatus">Task Status:</label>
            <select id="taskStatus">
                <option value="">--Select Status--</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
            <span id="errorTaskStatus" class="error-message"></span><br><br>


            <label>
                <input type="checkbox" id="taskNotification">
                Notify staff about the task
            </label><br><br>


            <button type="submit">Assign Task</button>
            <p id="formError" style="color:red; display:none;">Please fill in all required fields.</p>
        </form>


        <div id="confirmation" style="display:none;">
            <h3>Task Assigned Successfully</h3>
            <p>Task Name: <span id="confirmationTaskName"></span></p>
            <p>Assigned Staff: <span id="confirmationAssignStaff"></span></p>
            <p>Task Status: <span id="confirmationTaskStatus"></span></p>
            <p>Task Notification: <span id="confirmationNotification"></span></p>
        </div>
    </div>

    <script src="../Asset/js/stafftaskmJs.js"></script>
</body>

</html>
