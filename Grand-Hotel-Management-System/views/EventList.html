<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Reservation</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="container">

    <h2>Event Reservation System</h2>

    <label for="eventSelect">Select Event</label>
    <select id="eventSelect" onchange="loadEvent()"></select>

    <div class="event">
        <h3 id="eventTitle"></h3>
        <p id="eventDesc"></p>

        <p>
            <b>Total Seats:</b>
            <span id="totalSeats">0</span>
        </p>
        <p>
            <b>Available Seats:</b>
            <span id="availableSeats">0</span>
        </p>
    </div>

    <hr>

    <h3>Reserve Seats</h3>

    <label>Email</label>
    <input type="email" id="guestEmail" placeholder="Enter your email">

    <label>Number of Seats</label>
    <input type="number" id="seatInput" min="1" placeholder="Seats">

    <button onclick="reserveSeats()">Reserve</button>

    <p id="guestMsg"></p>

</div>

<script src="../assets/js/script3.js"></script>

</body>
</html>
