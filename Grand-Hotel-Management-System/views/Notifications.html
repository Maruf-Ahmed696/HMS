<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notifications</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="container">
    <h2>Notification Center</h2>

    <h3>Admin Broadcast</h3>

    <label for="type">Notification Type</label>
    <select id="type">
        <option value="Booking Alert">Booking Alert</option>
        <option value="Payment Notification">Payment Notification</option>
        <option value="Offer">Offer</option>
        <option value="System Alert">System Alert</option>
    </select>

    <label for="message">Message</label>
    <textarea id="message" placeholder="Write notification message"></textarea>

    <button onclick="sendNotification()">Send Notification</button>

    <hr>

    <h3>All Notifications</h3>
    <div id="notificationList"></div>
</div>

<script src="../assets/js/script4.js"></script>

</body>
</html>
